<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#0A0E18"/>
    </linearGradient>

    <!-- Emerald Ambient Lighting -->
    <radialGradient id="emeraldAmbient" cx="80%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanAmbient" cx="20%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Dot Grid -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.35"/>
    </pattern>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(1deg); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.4); }
      }
      .floating-cube {
        animation: floatSlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .ping-dot {
        animation: pulseDot 2.2s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Container Box with 1px border -->
  <rect x="1" y="1" width="858" height="248" rx="16" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="1.2"/>
  <rect x="1" y="1" width="858" height="248" rx="16" fill="url(#dotGrid)"/>
  <rect x="1" y="1" width="858" height="248" rx="16" fill="url(#emeraldAmbient)"/>
  <rect x="1" y="1" width="858" height="248" rx="16" fill="url(#cyanAmbient)"/>

  <!-- Left Side: Identity & Meta -->
  <g transform="translate(42, 38)">
    <!-- Top Pill Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="295" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#10B981" class="ping-dot"/>
      <text x="24" y="16" class="mono" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1.2">0xHOSEIN · ON-CHAIN SINCE 2021</text>
    </g>

    <!-- Main Title Name -->
    <text x="0" y="75" class="sans" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1.2">
      Hosein <tspan font-size="20" font-weight="500" fill="#64748B">(@hosein-ul)</tspan>
    </text>

    <!-- Tagline Subtitle -->
    <text x="0" y="108" class="sans" font-size="15" font-weight="500" fill="#38BDF8" letter-spacing="0.2">
      Web3 Systems Architect <tspan fill="#64748B">•</tspan> Smart Contract Engineer <tspan fill="#64748B">•</tspan> FHEVM Privacy
    </text>

    <!-- Focus Description Line -->
    <text x="0" y="132" class="sans" font-size="13" font-weight="400" fill="#94A3B8">
      Building non-custodial stablecoin rails, encrypted EVM state machines &amp; L2 DEX infrastructure.
    </text>

    <!-- Live Status Pill -->
    <g transform="translate(0, 154)">
      <rect x="0" y="0" width="410" height="28" rx="6" fill="#09131F" stroke="#0E2F40" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#10B981"/>
      <text x="26" y="18" class="mono" font-size="11" font-weight="600" fill="#E2E8F0" letter-spacing="0.6">
        NOW: <tspan fill="#10B981">OPTIMA DEX</tspan> (ROBINHOOD L2) &amp; <tspan fill="#38BDF8">PLINTH GATEWAY</tspan> (ARC)
      </text>
    </g>
  </g>

  <!-- Right Side: Clean High-Tech Geometric Web3 Isometric Cube Graphic -->
  <g class="floating-cube" transform="translate(680, 125)">
    <!-- Outer Orbit Circle -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="56" fill="none" stroke="#0F2D3A" stroke-width="1"/>

    <!-- Central Isometric Polygon Faces -->
    <!-- Top Face -->
    <polygon points="0,-42 36,-21 0,0 -36,-21" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" fill-opacity="0.8"/>
    <!-- Left Face -->
    <polygon points="-36,-21 0,0 0,42 -36,21" fill="#0F172A" stroke="#10B981" stroke-width="1.2" fill-opacity="0.9"/>
    <!-- Right Face -->
    <polygon points="0,0 36,-21 36,21 0,42" fill="#141E33" stroke="#38BDF8" stroke-width="1.2" fill-opacity="0.9"/>

    <!-- Glowing Nodes / Vertices -->
    <circle cx="0" cy="-42" r="3.5" fill="#38BDF8"/>
    <circle cx="36" cy="-21" r="3.5" fill="#10B981"/>
    <circle cx="-36" cy="-21" r="3.5" fill="#10B981"/>
    <circle cx="0" cy="42" r="3.5" fill="#38BDF8"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>

    <!-- Dynamic Tech Badges Floating Around Nodes -->
    <g transform="translate(-75, 42)">
      <rect width="48" height="18" rx="4" fill="#0D1524" stroke="#1E293B" stroke-width="1"/>
      <text x="24" y="13" class="mono" font-size="9" font-weight="600" fill="#10B981" text-anchor="middle">FHEVM</text>
    </g>
    <g transform="translate(35, -58)">
      <rect width="44" height="18" rx="4" fill="#0D1524" stroke="#1E293B" stroke-width="1"/>
      <text x="22" y="13" class="mono" font-size="9" font-weight="600" fill="#38BDF8" text-anchor="middle">NITRO</text>
    </g>
    <g transform="translate(38, 42)">
      <rect width="36" height="18" rx="4" fill="#0D1524" stroke="#1E293B" stroke-width="1"/>
      <text x="18" y="13" class="mono" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle">EVM</text>
    </g>
  </g>
</svg>
