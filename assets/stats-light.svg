<svg xmlns="http://www.w3.org/2000/svg" width="600" height="196" viewBox="0 0 600 196" role="img" aria-label="GitHub stats">
  <title>GitHub stats</title>
  <style>
    .v { font: 700 30px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -.8px; fill: #0d0d0f; }
    .l { font: 400 10px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .8px; fill: #6b6b73; }
    .m { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #6b6b73; }
  </style>
  <rect x=".5" y=".5" width="599" height="195" rx="10" fill="#ffffff" stroke="#e4e4e9"/>
  <rect x="24" y="24" width="18" height="3" rx="1.5" fill="#3b5bdb"/>
  <text class="v" x="24" y="62">—</text><text class="l" x="24" y="84">COMMITS 2026</text>
  <text class="v" x="162" y="62">—</text><text class="l" x="162" y="84">PULL REQUESTS 2026</text>
  <text class="v" x="300" y="62">—</text><text class="l" x="300" y="84">PUBLIC REPOS</text>
  <text class="v" x="438" y="62">—</text><text class="l" x="438" y="84">DAY STREAK</text>
  <line x1="24" y1="102" x2="576" y2="102" stroke="#e4e4e9"/>
  <rect x="24" y="118" width="552" height="6" rx="3" fill="#e4e4e9"/>
  <text class="m" x="24" y="154">Languages appear after the first scheduled run.</text>
  <text class="l" x="24" y="182">TOP LANGUAGES · PUBLIC REPOS</text>
</svg>
