name: profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "cards.json"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      # Each generator reads from the GitHub API, builds every file in memory and only then writes.
      # If any call fails the script exits non-zero, the previous SVGs stay untouched and the job fails.
      - name: Project cards
        run: node scripts/build-cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats
        run: node scripts/build-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a classic PAT with read:user so private contributions are counted.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Contribution calendar
        run: node scripts/build-calendar.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "assets unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh profile assets"
          git push
