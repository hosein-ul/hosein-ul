name: Contribution snake

on:
  schedule:
    - cron: "41 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Monochrome grid, accent snake. `%23` is an escaped `#`.
          outputs: |
            dist/snake.svg?color_snake=%233b5bdb&color_dots=%23ececf0,%23d4d4da,%23a8a8b3,%2370707c,%2338383f
            dist/snake-dark.svg?color_snake=%238da2ff&color_dots=%2319191f,%2330303a,%2350505c,%237e7e8c,%23b4b4c0

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
